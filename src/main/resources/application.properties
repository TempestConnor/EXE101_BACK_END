spring.application.name=exe101-backend
# Optional local settings (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, ...); .local is gitignored.
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}
app.admin.login-name=${ADMIN_LOGIN_NAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.storage.root=${STORAGE_ROOT:.local/storage}
# Files on disk with no StoredFile row (left by a rolled-back upload) are deleted once older than the minimum age.
app.storage.orphan-min-age=PT24H
app.storage.orphan-sweep-interval=PT6H
# Listing files may be up to 200 MB; previews keep their own 10 MB limit in the service.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB
