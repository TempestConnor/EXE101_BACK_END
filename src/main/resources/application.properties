spring.application.name=exe101-backend
# Optional local settings (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, ...); .local is gitignored.
spring.config.import=optional:file:./.local/application.properties
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.sql.init.mode=never
# Integer fields reject fractional JSON numbers (1.5) instead of truncating them.
spring.jackson.deserialization.accept-float-as-int=false
app.jwt.secret=${JWT_SECRET}
# Browser origins allowed to call the API from another origin, comma-separated exact origins
# (https://shop.example.com,http://localhost:3000); no wildcards. Empty allows none, which is right when the storefront
# is served from the same origin or through a dev proxy.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.admin.login-name=${ADMIN_LOGIN_NAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.storage.root=${STORAGE_ROOT:.local/storage}
# Files on disk with no StoredFile row (left by a rolled-back upload) are deleted once older than the minimum age.
app.storage.orphan-min-age=PT24H
app.storage.orphan-sweep-interval=PT6H
# Listing files may be up to 200 MB; previews keep their own 10 MB limit in the service.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=201MB
# Demo manufacturing products and costs (VND): placeholders until the real costs are known.
app.manufacturing.products[0].code=PRINT_A4
app.manufacturing.products[0].name=Fine-art print A4
app.manufacturing.products[0].specifications=Fine-art print, A4 (210 x 297 mm), 230 gsm matte paper
app.manufacturing.products[0].cost=80000
app.manufacturing.products[1].code=PRINT_A3
app.manufacturing.products[1].name=Fine-art print A3
app.manufacturing.products[1].specifications=Fine-art print, A3 (297 x 420 mm), 230 gsm matte paper
app.manufacturing.products[1].cost=120000
app.manufacturing.products[2].code=PRINT_A2
app.manufacturing.products[2].name=Fine-art print A2
app.manufacturing.products[2].specifications=Fine-art print, A2 (420 x 594 mm), 230 gsm matte paper
app.manufacturing.products[2].cost=200000
app.manufacturing.products[3].code=PRINT_A1
app.manufacturing.products[3].name=Fine-art print A1
app.manufacturing.products[3].specifications=Fine-art print, A1 (594 x 841 mm), 230 gsm matte paper
app.manufacturing.products[3].cost=320000
app.manufacturing.products[4].code=PRINT_A0
app.manufacturing.products[4].name=Fine-art print A0
app.manufacturing.products[4].specifications=Fine-art print, A0 (841 x 1189 mm), 230 gsm matte paper
app.manufacturing.products[4].cost=500000
app.manufacturing.products[5].code=CANVAS_40X60
app.manufacturing.products[5].name=Canvas 40 x 60
app.manufacturing.products[5].specifications=Canvas print, 40 x 60 cm, stretched on a 2 cm wooden frame
app.manufacturing.products[5].cost=350000
# Demo checkout values (VND): tax rate as a fraction of each line total, rounded half-up to whole VND per line;
# one flat shipping fee per Order with physical items. Placeholders until the real values are known.
app.checkout.tax-rate=0
app.checkout.shipping-fee=30000
app.checkout.max-physical-quantity=99
# A new Order can be paid for this long; overdue pending Orders are marked EXPIRED by a job at this interval.
app.orders.payment-window=PT30M
app.orders.expiry-interval=PT1M
# A delivered physical item can be returned for this long (amendment C.9); a job at this interval grants its
# included files once the window has closed with no open or approved return.
app.fulfillment.return-window=PT48H
app.fulfillment.grant-interval=PT10M
# VNPay (payment API 2.1.0): terminal code and hash secret from the VNPay merchant portal; the sandbox page by
# default. The return URL is the storefront page shown after paying; only the IPN (/payments/vnpay/ipn) confirms.
app.payments.vnpay.tmn-code=${VNPAY_TMN_CODE}
app.payments.vnpay.hash-secret=${VNPAY_HASH_SECRET}
app.payments.vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
app.payments.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:3000/payment/return}
# Behind a reverse proxy (nginx, ngrok, a Docker network) the buyer's address sent as vnp_IpAddr comes from
# X-Forwarded-For. Tomcat honours that header only from internal proxy addresses (loopback and private ranges), so a
# client cannot set it itself; a proxy on a public address must be listed in server.tomcat.remoteip.internal-proxies.
server.forward-headers-strategy=native
