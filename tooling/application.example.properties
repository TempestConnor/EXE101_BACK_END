# Copy to .local/application.properties (gitignored) and fill in your own values. Never commit the filled-in copy.
# Environment variables with the same names override these.

# Database: your local SQL Server (see README, "Setting up a new database").
DB_URL=jdbc:sqlserver://localhost:1433;databaseName=CuratedArtworkMarketplace;encrypt=true;trustServerCertificate=true;loginTimeout=10
DB_USERNAME=sa
DB_PASSWORD=replace-with-your-local-password

# Token signing key: at least 32 random bytes, Base64-encoded. Generate one in PowerShell with
#   [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Maximum 256 }) -as [byte[]])
JWT_SECRET=replace-with-a-generated-key
# Optional: how long sign-ins last (ISO-8601 duration), 2 hours by default.
# JWT_ACCESS_TOKEN_LIFETIME=PT2H

# Optional: creates the first Admin staff account at startup if no Admin exists (password 12-128 characters).
# ADMIN_LOGIN_NAME=admin
# ADMIN_PASSWORD=replace-with-a-long-password

STORAGE_ROOT=.local/storage

# Only if the storefront calls the API from another origin (not through the Vite proxy).
# CORS_ALLOWED_ORIGINS=http://localhost:3000

# VNPay SANDBOX merchant: your own, from VNPay's sandbox registration email (README, "VNPay sandbox").
# Each developer needs their own: a merchant has one IPN URL, so a shared one confirms only one person's payments.
VNPAY_TMN_CODE=replace-with-your-terminal-id
VNPAY_HASH_SECRET=replace-with-your-secret-key
VNPAY_RETURN_URL=http://localhost:3000/payment/return
